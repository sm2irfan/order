org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable Gradle daemon (reuses Gradle process)
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Configure worker count (use number of CPU cores - 1)
org.gradle.workers.max=3

# Enable configuration on demand
org.gradle.configureondemand=true

# Enable incremental builds for Kotlin
kotlin.incremental=true
kotlin.incremental.android=true

# Enable Kotlin compiler daemon
kotlin.compiler.execution.strategy=daemon
